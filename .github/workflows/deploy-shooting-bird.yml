name: Deploy shooting-bird to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "games/shooting-bird/**"
      - ".github/workflows/deploy-shooting-bird.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/shooting-bird
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build --base=/ai/
        working-directory: games/shooting-bird/apps/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/shooting-bird/apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
